name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Takes the version from minimum_zig_version in build.zig.zon.
      - uses: mlugg/setup-zig@v2

      - name: Run the unit tests
        run: zig build test --summary all

      - name: Build for Android
        run: zig build android

      - name: Build for this machine
        run: zig build --release

      - name: Start
        run: ./zig-out/bin/pharbor version

  web:
    name: Web interface is built
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build

      # The build is committed so that zig build needs no Node.
      - name: The committed build matches the sources
        run: |
          git add -N src/web src/web_assets.zig
          git diff --exit-code --stat -- src/web src/web_assets.zig

  scripts:
    name: Install scripts parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Phones run them with toybox or busybox sh: POSIX only.
      - name: POSIX syntax
        run: |
          for f in install.sh uninstall.sh; do
            dash -n "$f"
            sh "$f" --help > /dev/null
          done
